name: Check

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint, type check, test and build
        run: npm run check

      - name: Compare solver results with the snapshot
        env:
          CHROME: /usr/bin/google-chrome-stable
        run: npm run snapshot:check -- --dist
