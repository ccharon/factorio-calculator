name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint, type check, test and build
        run: npm run check

      - name: Push to dist branch
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          SHA=$(git rev-parse --short HEAD)
          git checkout --orphan dist-new
          git rm -rf . --cached -q
          # The files of dist/ become the root of the branch.
          git --work-tree=dist add --all
          git commit -m "dist: build from $SHA"
          git push origin HEAD:dist --force
